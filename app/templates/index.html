<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Tic-Tac-Toe - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: url("/static/image/background1.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .home-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 52px 56px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.95);
      border: 1px solid rgba(255, 255, 255, 0.7);
      max-width: 420px;
      width: 90%;
    }

    .logo {
      font-size: 3.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      filter: drop-shadow(0 2px 10px rgba(118, 75, 162, 0.35));
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 1rem;
      color: #8e8ea8;
      margin-bottom: 36px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #f093fb);
      border-radius: 99px;
      margin: 0 auto 32px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.65);
    }

    .btn-pvp {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.45);
    }

    .btn-pvp:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 30px rgba(231, 76, 60, 0.6);
    }

    .btn-secondary {
      background: rgba(102, 126, 234, 0.08);
      color: #764ba2;
      border: 1.5px solid rgba(118, 75, 162, 0.25);
      box-shadow: 0 2px 8px rgba(118, 75, 162, 0.1);
    }

    .btn-secondary:hover {
      transform: translateY(-2px) scale(1.03);
      background: rgba(102, 126, 234, 0.14);
      box-shadow: 0 6px 18px rgba(118, 75, 162, 0.22);
    }

    .btn:active {
      transform: scale(0.97) translateY(0);
    }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="logo">Super<br>Tic-Tac-Toe</div>
    <p class="tagline">9 boards. One winner. Can you claim victory?</p>
    <div class="divider"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.href='game'">Play vs AI</button>
      <button class="btn btn-pvp" onclick="window.location.href='pvp'">Player vs Player</button>
      <button class="btn btn-secondary" onclick="window.location.href='instructions'">How to Play</button>
    </div>
  </div>
</body>
</html>
