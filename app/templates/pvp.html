<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Tic-Tac-Toe - Player vs Player</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <div class="container">
        <h1>Super Tic-Tac-Toe</h1>

        <div class="game-info">
            <button id="back-home" class="back-home" onclick="window.location.href='/'">&#8592; Home</button>

            <div class="scores">
                <div class="score">
                    <span>&#10005;</span>
                    <span>Player 1:</span>
                    <span id="player-score">0</span>
                </div>
                <div class="score">
                    <span>&#9711;</span>
                    <span>Player 2:</span>
                    <span id="ai-score">0</span>
                </div>
            </div>

            <div id="status" class="status">Connecting...</div>

            <button id="reset-button" class="reset-button">&#8634; Reset</button>
        </div>

        <div class="game-container">
            <div class="meta-board">
                <h3>Meta Board</h3>
                <div class="meta-grid">
                    <!-- Meta board cells will be added here by JavaScript -->
                </div>
            </div>

            <div class="main-board">
                <div class="grid">
                    <!-- Board cells will be added here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon"></div>
            <h2 id="modal-title" class="modal-title"></h2>
            <p id="modal-subtitle" class="modal-subtitle"></p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="document.getElementById('reset-button').click(); document.getElementById('game-over-modal').style.display='none';">Play Again</button>
                <button class="modal-btn modal-btn-secondary" onclick="window.location.href='/'">Back to Home</button>
            </div>
        </div>
    </div>

    <script src="/static/js/pvp.js"></script>
</body>
</html>
